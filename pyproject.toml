[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pennypilot"
version = "0.1.0"
description = "Aplikasi lokal untuk mencatat, mengategorikan, dan menganalisis pengeluaran pribadi dari CSV."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PennyPilot contributors" }]
dependencies = [
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["pennypilot*"]

[tool.setuptools.package-data]
pennypilot = ["sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
